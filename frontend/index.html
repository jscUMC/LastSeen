<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Last Seen - Login</title>
    <link rel="stylesheet" href="css/style.css">
    <!-- Opcional: Una fuente de Google Fonts para darle ese toque retro/noir -->
    <link href="https://fonts.googleapis.com/css2?family=Courier+Prime:wght@400;700&family=Oswald:wght@500;700&display=swap" rel="stylesheet">
</head>
<body class="login-bg">
    <div class="login-container">
        <div class="monitor-box">
            <div class="logo-section">
                <h1>LAST SEEN</h1>
                <p class="subtitle">UNA AVENTURA DETECTIVESCA NOIR</p>
            </div>
            
            <form id="loginForm" class="login-form">
                <div class="input-group">
                    <label for="username">NOMBRE DE USUARIO</label>
                    <div class="input-wrapper">
                        <span class="icon-search">🔍</span>
                        <input type="text" id="username" name="username" placeholder="Escribe tu nombre..." required autocomplete="off">
                    </div>
                </div>
                
                <button type="submit" class="btn-start">EMPEZAR INVESTIGACIÓN</button>
            </form>
        </div>
    </div>

    <script src="js/main.js"></script>
</body>
</html>
